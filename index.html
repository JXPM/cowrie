<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cowrie">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Cowrie</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --field:#f9fafb;
  --text:#111827; --text-2:#4b5563; --text-3:#9ca3af;
  --line:#e5e7eb; --line-2:#f1f2f4;
  --s1:#1f2937; --s2:#9ca3af; --s3:#14b8a6; --s4:#e5e7eb;
  --c1:#111827; --c2:#14b8a6; --c3:#f59e0b; --c4:#6366f1; --c5:#ec4899;
  --green:#15803d; --amber:#b45309; --red:#b91c1c;
  --green-bg:#dcfce7; --amber-bg:#fef3c7; --red-bg:#fee2e2;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding:0 14px 60px; padding-top:env(safe-area-inset-top);
}
h1,h2,h3{margin:0; font-weight:600}
button{font-family:inherit; cursor:pointer}
input{font-family:inherit; color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:900px; margin:0 auto}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-top:14px}
.cap{font-size:12.5px; font-weight:500; color:var(--text-3); margin-bottom:12px}

/* header */
.hd{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:18px 2px 4px}
.brand{margin-right:auto; display:flex; align-items:center; gap:9px}
.brand .lm{width:22px; height:22px; color:var(--text)}
.brand .b{font-weight:700; font-size:17px; letter-spacing:-.01em}
.mn{display:flex; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.mn button{border:none; background:transparent; color:var(--text); width:34px; height:34px; font-size:18px; display:grid; place-items:center}
.mn button:hover{background:var(--field)}
.mn .c{min-width:136px; text-align:center; font-size:13.5px; font-weight:500; text-transform:capitalize}

/* verdict */
.vd{display:grid; grid-template-columns:1fr auto; gap:8px 24px; align-items:end}
.vd .lab{color:var(--text-2); font-size:13.5px; margin-bottom:6px}
.vd .big{font-weight:700; letter-spacing:-.03em; line-height:1; font-size:clamp(40px,11vw,64px); transition:color .3s}
.vd .big.green{color:var(--green)} .vd .big.amber{color:var(--amber)} .vd .big.red{color:var(--red)}
.badge{justify-self:end; display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:500}
.badge .k{width:7px; height:7px; border-radius:50%}
.badge.green{color:var(--green); background:var(--green-bg)} .badge.green .k{background:var(--green)}
.badge.amber{color:var(--amber); background:var(--amber-bg)} .badge.amber .k{background:var(--amber)}
.badge.red{color:var(--red); background:var(--red-bg)} .badge.red .k{background:var(--red)}
.mstats{grid-column:1/-1; display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line-2)}
.mstats .u{display:flex; flex-direction:column; gap:2px; font-size:12.5px; color:var(--text-3)}
.mstats .u b{color:var(--text); font-size:16px; font-weight:600}

/* flow bar */
.fbar{display:flex; height:12px; width:100%; overflow:hidden; background:var(--line-2); border-radius:6px}
.fbar > span{display:block; height:100%; transition:width .4s ease}
.s1{background:var(--s1)} .s2{background:var(--s2)} .s3{background:var(--s3)} .s4{background:var(--s4)}
.leg{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px; font-size:12.5px}
.leg .it{display:flex; align-items:center; gap:7px; color:var(--text-2)}
.leg .sw{width:10px; height:10px; border-radius:3px; flex:none}
.leg .it b{color:var(--text); font-weight:600} .leg .it .p{color:var(--text-3)}

/* ledger */
.ledger{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px}
@media (max-width:720px){ .ledger{grid-template-columns:minmax(0,1fr)} .vd{grid-template-columns:1fr} .badge{justify-self:start} }
.sec{margin-top:0; min-width:0}
.shd{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-bottom:10px; margin-bottom:4px; border-bottom:1px solid var(--line)}
.shd h3{font-size:14.5px}
.shd .t{font-weight:600; font-size:14.5px}
.shd .t.neg::before{content:"– "; color:var(--text-3)}
.shd .t .un{color:var(--text-3); font-weight:400; font-size:11.5px}
.paidbar{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; color:var(--text-3); margin:6px 0 4px}
.paidbar b{color:var(--text-2); font-weight:500}
.pline{height:4px; background:var(--line-2); border-radius:2px; overflow:hidden; margin-bottom:6px}
.pline > span{display:block; height:100%; background:var(--green); transition:width .3s; border-radius:2px}
.r{display:flex; align-items:center; gap:6px; padding:3px 0}
.r + .r{border-top:1px solid var(--line-2)}
.lbl{flex:1; min-width:0; border:none; background:transparent; font-size:14px; padding:7px 4px; border-radius:6px}
.lbl:focus{outline:none; background:var(--field)}
.r.paid .lbl{color:var(--text-3); text-decoration:line-through}
.r.paid .amt{color:var(--text-3)}
.chk{appearance:none; -webkit-appearance:none; width:18px; height:18px; flex:none; border:1.5px solid var(--line); border-radius:5px; background:var(--card); display:grid; place-items:center; cursor:pointer; margin:0}
.chk:checked{background:var(--green); border-color:var(--green)}
.chk:checked::after{content:""; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg)}
.aw{position:relative; display:flex; align-items:center}
.aw .e{position:absolute; right:8px; color:var(--text-3); font-size:12px; pointer-events:none}
.amt{width:96px; text-align:right; border:1px solid transparent; background:transparent; border-radius:6px; font-size:14px; padding:6px 20px 6px 6px; font-variant-numeric:tabular-nums}
.amt:hover{border-color:var(--line)}
.amt:focus{outline:none; border-color:var(--text-3); background:var(--field)}
.x{border:none; background:transparent; color:var(--text-3); width:26px; height:26px; font-size:16px; display:grid; place-items:center; border-radius:6px; opacity:.5}
.x:hover{opacity:1; color:var(--red); background:var(--red-bg)}
.addl{margin-top:8px}
.addl button{border:1px dashed var(--line); background:transparent; color:var(--text-3); width:100%; text-align:left; padding:8px 10px; font-size:13px; border-radius:8px}
.addl button:hover{color:var(--text); border-color:var(--text-3)}

/* savings rows */
.sv{padding:7px 0}
.sv + .sv{border-top:1px solid var(--line-2)}
.sv .l1{display:flex; align-items:center; gap:6px}
.sv .l2{display:flex; align-items:center; gap:14px; margin-top:4px; padding-left:4px; flex-wrap:wrap}
.sv .mf{display:flex; align-items:center; gap:4px; color:var(--text-3); font-size:12px}
.mini{width:70px; text-align:right; border:1px solid var(--line); background:var(--card); border-radius:6px; font-size:12.5px; padding:3px 18px 3px 4px; font-variant-numeric:tabular-nums}
.mini:focus{outline:none; border-color:var(--text-3)}
.mf .aw .e{font-size:11px; right:6px}

/* goals */
.grow{margin-bottom:14px}
.grow:last-child{margin-bottom:0}
.grow .gt{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; font-size:13.5px}
.grow .gt .nm{font-weight:500}
.grow .gt .pc{font-weight:600; color:var(--text-2); font-variant-numeric:tabular-nums}
.gline{height:6px; background:var(--line-2); border-radius:3px; position:relative; overflow:hidden}
.gline > span{position:absolute; left:0; top:0; height:100%; background:var(--s3); transition:width .4s ease; border-radius:3px}
.grow .gm{display:flex; justify-content:space-between; margin-top:5px; font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums}

/* tracking */
.thd{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.thd h3{font-size:14.5px}
.thd .tm{font-size:12px; color:var(--text-3)}
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart .line{fill:none; stroke:var(--text); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.chart .zero{stroke:var(--line); stroke-dasharray:2 4; stroke-width:1}
.chart .grid{stroke:var(--line-2); stroke-width:1}
.chart .pt{fill:var(--card); stroke:var(--text); stroke-width:2}
.chart .last{stroke-width:2.5}
.chart text{fill:var(--text-3); font-size:10.5px; font-family:"Inter",system-ui,sans-serif}
.empty{color:var(--text-3); font-size:13px; padding:10px 0; line-height:1.5}
.svlist{display:grid; gap:8px; margin-top:12px}
.svrow{display:flex; align-items:center; gap:10px; font-size:13.5px}
.svrow .sw{width:10px; height:10px; border-radius:3px; flex:none}
.svrow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.svrow .bal{font-weight:600; font-variant-numeric:tabular-nums}
.dl{font-size:12px; color:var(--text-3); min-width:64px; text-align:right; font-variant-numeric:tabular-nums}
.dl.up{color:var(--green)} .dl.dn{color:var(--red)}
.svtot{display:flex; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:1px solid var(--line-2); font-size:13.5px}
.svtot b{font-weight:600}

/* bank */
.bk-hd{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.bk-hd h3{font-size:14.5px}
.bk-st{font-size:12px; color:var(--text-3)}
.bk-st.ok{color:var(--green)} .bk-st.err{color:var(--red)}
.btn{border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; font-weight:500; padding:7px 12px; border-radius:8px}
.btn:hover{background:var(--field)}
.btn.pri{background:var(--text); color:#fff; border-color:var(--text)}
.btn.pri:hover{background:#000}
.btn:disabled{opacity:.5; cursor:default}
.bk-acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.bk-acc{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line-2); font-size:13.5px}
.bk-acc:first-child{border-top:none}
.bk-acc .nm{font-weight:500} .bk-acc .ib{font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums}
.bk-acc .bal{font-weight:600; font-variant-numeric:tabular-nums}
.bk-search{width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; background:var(--card); margin:10px 0}
.bk-search:focus{outline:none; border-color:var(--text-3)}
.bk-list{max-height:280px; overflow:auto; border:1px solid var(--line); border-radius:8px}
.bk-list button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; border-top:1px solid var(--line-2); background:transparent; padding:9px 12px; font-size:13.5px}
.bk-list button:first-child{border-top:none}
.bk-list button:hover{background:var(--field)}
.bk-list img{width:22px; height:22px; border-radius:5px; object-fit:contain; background:#fff; flex:none}
.pw{display:flex; gap:8px; margin-top:10px}
.pw input{flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px}
.note{font-size:12.5px; color:var(--text-3); line-height:1.5; margin-top:8px}
.tx{display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line-2); font-size:13px}
.tx:first-child{border-top:none}
.tx .dt{color:var(--text-3); font-variant-numeric:tabular-nums; flex:none; width:38px; font-size:12px}
.tx .tt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tx .tt .lk{display:block; font-size:11px; color:var(--green)}
.tx .am{font-weight:600; font-variant-numeric:tabular-nums; flex:none}
.tx .am.in{color:var(--green)}
.tx.pend{opacity:.6}
.tx select{max-width:34px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text-3); font-size:12px; padding:3px 2px; flex:none}
.tx select.set{color:var(--green); border-color:var(--green-bg); background:var(--green-bg)}
.txsum{display:flex; gap:20px; flex-wrap:wrap; font-size:12.5px; color:var(--text-3); margin-bottom:10px}
.txsum b{color:var(--text); font-weight:600}
.tag{display:inline-block; font-size:10px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--green); background:var(--green-bg); padding:1px 5px; border-radius:4px; margin-left:4px; vertical-align:middle}

/* settings */
.set{display:flex; flex-wrap:wrap; gap:12px 26px; align-items:center; color:var(--text-2); font-size:13.5px}
.set .g{display:flex; align-items:center; gap:8px}
.set .mini{width:78px}
.ft{max-width:900px; margin:16px auto 0; color:var(--text-3); font-size:11.5px; text-align:center; line-height:1.6}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--text); outline-offset:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="brand"><svg class="lm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="6" ry="8.6"/><path d="M12 5.6V18.4"/><path d="M9.7 8.6 12 9.3M9.7 11 12 11M9.7 13.4 12 13.4M9.7 15.8 12 15.1"/><path d="M14.3 8.6 12 9.3M14.3 11 12 11M14.3 13.4 12 13.4M14.3 15.8 12 15.1"/></svg><span class="b">Cowrie</span></div>
    <div class="mn"><button id="prevM" aria-label="Mois précédent">‹</button><span class="c" id="curMonth">—</span><button id="nextM" aria-label="Mois suivant">›</button></div>
  </div>

  <div class="card vd">
    <div>
      <div class="lab" id="vLab">Il te reste à la fin du mois</div>
      <div class="big green num" id="marge">—</div>
    </div>
    <div class="badge green" id="badge"><span class="k"></span><span id="badgeTxt">—</span></div>
    <div class="mstats" id="mstats"></div>
  </div>

  <div class="card">
    <div class="cap">Où part chaque euro de revenu</div>
    <div class="fbar" id="fbar"></div>
    <div class="leg" id="leg"></div>
  </div>

  <div class="card" id="bank">
    <div class="bk-hd"><h3>Banque</h3><span class="bk-st" id="bkSt"></span></div>
    <div id="bkBody"></div>
  </div>

  <div class="ledger" id="ledger" style="margin-top:14px"></div>

  <div class="card" id="txCard" hidden>
    <div class="thd"><h3 id="txTitle">Transactions</h3><span class="tm" id="txMeta"></span></div>
    <div class="txsum" id="txSum"></div>
    <div id="txList"></div>
  </div>

  <div class="card">
    <div class="cap">Objectifs d'épargne</div>
    <div id="goals"></div>
  </div>

  <div class="card">
    <div class="thd"><h3>Suivi de l'épargne</h3><span class="tm" id="svMeta"></span></div>
    <div id="svchart"></div>
    <div id="svlist"></div>
  </div>

  <div class="card">
    <div class="thd"><h3>Marge mois par mois</h3><span class="tm" id="trMeta"></span></div>
    <div id="hist"></div>
  </div>

  <div class="card set">
    <div class="g">Passe au rouge sous <span class="aw"><input class="mini" id="setRed" inputmode="decimal"><span class="e">€</span></span></div>
    <div class="g">Passe au vert dès <span class="aw"><input class="mini" id="setGreen" inputmode="decimal"><span class="e">€</span></span></div>
  </div>
</div>
<p class="ft">Enregistré automatiquement sur cet appareil. Chaque chiffre se recalcule en direct.</p>

<script>
(function(){
  "use strict";
  var MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var MO3=["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
  var LS_KEY="mon-budget-v1";
  var COLORS=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
  var SECTIONS=[
    {key:"income", title:"Revenus"},
    {key:"fixed",  title:"Dépenses fixes", paid:true},
    {key:"daily",  title:"Vie quotidienne"},
    {key:"savings",title:"Épargne & projets", savings:true}
  ];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function nowKey(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function monthName(k){ return MONTHS[(+k.split("-")[1])-1]; }
  function labelFor(k){ var p=k.split("-"); return MONTHS[(+p[1])-1]+" "+p[0]; }
  function shortFor(k){ var p=k.split("-"); return MO3[(+p[1])-1]+" "+p[0].slice(2); }
  function shiftKey(k,delta){ var p=k.split("-"); var d=new Date(+p[0],(+p[1]-1)+delta,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function num(v){ if(typeof v==="number")return v; var n=parseFloat(String(v).replace(/\s/g,"").replace(",",".").replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; }
  function euro(n){ return n.toLocaleString("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}); }
  function euro0(n){ return n.toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function fmtIn(n){ return String(num(n)); }
  function line(label,amount,extra){ var o={id:uid(),label:label,amount:amount}; if(extra)for(var k in extra)o[k]=extra[k]; return o; }

  function defaultMonth(){
    return {
      income:[ line("Salaire",900), line("Aide de mon père",300), line("CAF logement",199) ],
      fixed:[ line("Loyer",530), line("Transport",16.5), line("Téléphone (forfaits + remb.)",54),
              line("Fibre Bouygues",31), line("Électricité",33.18), line("Netflix",15),
              line("Canva",12), line("ChatGPT",8), line("Claude",21), line("iCloud",0.99) ],
      daily:[ line("Extras courses / Uber Eats",60), line("Activités avec ma copine",100), line("Taxi / Uber",50) ],
      savings:[ line("Livret A — sécurité",250,{balance:0,goal:1000}),
                line("Akams",70,{balance:0,goal:1000}),
                line("PEA",50,{balance:0,goal:0}) ]
    };
  }
  function defaultState(){ var k=nowKey(); var m={}; m[k]=defaultMonth(); return {activeMonth:k,months:m,settings:{red:0,green:100}}; }

  var state=null;
  function loadLocal(){ try{ var r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
  function saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} }
  function touched(){ saveLocal(); }
  function m(){ return state.months[state.activeMonth]; }
  function totals(mo){ var t={income:0,fixed:0,daily:0,savings:0,paid:0,paidCount:0}; ["income","fixed","daily","savings"].forEach(function(k){ (mo[k]||[]).forEach(function(l){ t[k]+=num(l.amount); }); });
    (mo.fixed||[]).forEach(function(l){ if(l.paid){ t.paid+=num(l.amount); t.paidCount++; } });
    t.margin=t.income-t.fixed-t.daily-t.savings; t.toPay=t.fixed-t.paid; return t; }
  function marginOf(mo){ return totals(mo).margin; }
  function statusFor(mg){ var s=state.settings; if(mg<num(s.red))return{cls:"red",txt:"Risqué"}; if(mg>=num(s.green))return{cls:"green",txt:"Confortable"}; return{cls:"amber",txt:"Prudence"}; }

  /* ledger */
  function secTotal(sec,sum){ return euro(sum)+(sec.savings?' <span class="un">/ mois</span>':''); }
  function paidHtml(mo){
    var items=mo.fixed||[], n=items.length, t=totals(mo), pct=t.fixed>0?t.paid/t.fixed*100:0;
    return '<div class="paidbar"><span><b>'+t.paidCount+' / '+n+'</b> payées</span><span>reste <b class="num">'+euro(t.toPay)+'</b></span></div>'
      +'<div class="pline"><span style="width:'+pct.toFixed(1)+'%"></span></div>';
  }
  function renderSectionTotals(){
    var mo=m();
    SECTIONS.forEach(function(sec){
      var el=document.querySelector('.sec[data-cat="'+sec.key+'"] .shd .t'); if(!el)return;
      var sum=0; (mo[sec.key]||[]).forEach(function(l){ sum+=num(l.amount); });
      el.innerHTML=secTotal(sec,sum);
      if(sec.paid){ var p=document.querySelector('.sec[data-cat="'+sec.key+'"] .paid'); if(p)p.innerHTML=paidHtml(mo); }
    });
  }
  function renderLedger(){
    var mo=m(), host=document.getElementById("ledger"), html="";
    SECTIONS.forEach(function(sec){
      var items=mo[sec.key]||[], sum=0; items.forEach(function(l){ sum+=num(l.amount); });
      var neg = sec.key!=="income";
      html+='<div class="card sec" data-cat="'+sec.key+'">';
      html+='<div class="shd"><h3>'+esc(sec.title)+'</h3><span class="t num'+(neg?" neg":"")+'">'+secTotal(sec,sum)+'</span></div>';
      if(sec.paid) html+='<div class="paid">'+paidHtml(mo)+'</div>';
      items.forEach(function(l){
        if(sec.savings){
          html+='<div class="sv" data-id="'+l.id+'"><div class="l1">'
            +'<input class="lbl" data-field="label" value="'+esc(l.label)+'">'
            +'<span class="aw"><input class="amt" data-field="amount" inputmode="decimal" value="'+fmtIn(l.amount)+'"><span class="e">€</span></span>'
            +'<button class="x" data-act="del" aria-label="Supprimer">×</button></div>'
            +'<div class="l2"><span class="mf">déjà <span class="aw"><input class="mini" data-field="balance" inputmode="decimal" value="'+fmtIn(l.balance||0)+'"><span class="e">€</span></span></span>'
            +'<span class="mf">objectif <span class="aw"><input class="mini" data-field="goal" inputmode="decimal" value="'+fmtIn(l.goal||0)+'"><span class="e">€</span></span></span></div></div>';
        }else{
          html+='<div class="r'+(sec.paid&&l.paid?" paid":"")+'" data-id="'+l.id+'">'
            +(sec.paid?'<input type="checkbox" class="chk" data-field="paid" aria-label="Payé"'+(l.paid?' checked':'')+'>':'')
            +'<input class="lbl" data-field="label" value="'+esc(l.label)+'">'
            +(sec.paid&&l.paid&&l.paidTx?'<span class="tag" title="Rapproché avec une transaction bancaire">banque</span>':'')
            +'<span class="aw"><input class="amt" data-field="amount" inputmode="decimal" value="'+fmtIn(l.amount)+'"><span class="e">€</span></span>'
            +'<button class="x" data-act="del" aria-label="Supprimer">×</button></div>';
        }
      });
      html+='<div class="addl"><button data-act="add">+ ajouter une ligne</button></div>';
      html+='</div>';
    });
    host.innerHTML=html;
  }

  function renderDerived(){
    renderSectionTotals();
    var mo=m(), t=totals(mo), st=statusFor(t.margin);
    var big=document.getElementById("marge");
    big.textContent=(t.margin>=0?"+":"–")+" "+euro(Math.abs(t.margin));
    big.className="big num "+st.cls;
    document.getElementById("badge").className="badge "+st.cls;
    document.getElementById("badgeTxt").textContent=st.txt;
    document.getElementById("vLab").textContent="Il te reste à la fin de "+monthName(state.activeMonth);
    document.getElementById("mstats").innerHTML=
      '<div class="u"><span>Revenus</span><b class="num">'+euro0(t.income)+'</b></div>'
      +'<div class="u"><span>Sorties</span><b class="num">'+euro0(t.fixed+t.daily)+'</b></div>'
      +'<div class="u"><span>Épargne</span><b class="num">'+euro0(t.savings)+'</b></div>'
      +'<div class="u"><span>Fixes à payer</span><b class="num">'+euro0(t.toPay)+'</b></div>';

    var base=t.income||1;
    var segs=[{c:"s1",n:"Dépenses fixes",v:t.fixed},{c:"s2",n:"Vie quotidienne",v:t.daily},{c:"s3",n:"Épargne",v:t.savings},{c:"s4",n:"Marge libre",v:Math.max(0,t.margin)}];
    var bar="",leg="";
    segs.forEach(function(s){ var pct=Math.max(0,Math.min(100,s.v/base*100));
      bar+='<span class="'+s.c+'" style="width:'+pct.toFixed(2)+'%"></span>';
      leg+='<span class="it"><span class="sw '+s.c+'"></span>'+s.n+' <b class="num">'+euro0(s.v)+'</b> <span class="p num">'+Math.round(pct)+'%</span></span>';
    });
    document.getElementById("fbar").innerHTML=bar;
    document.getElementById("leg").innerHTML=leg+(t.margin<0?'<span class="it" style="color:var(--red)">déficit de '+euro(Math.abs(t.margin))+'</span>':'');

    var g="",any=false;
    (mo.savings||[]).forEach(function(l){ var goal=num(l.goal); if(goal<=0)return; any=true;
      var bal=num(l.balance),pct=Math.max(0,Math.min(100,bal/goal*100));
      g+='<div class="grow"><div class="gt"><span class="nm">'+esc(l.label)+'</span><span class="pc">'+Math.round(pct)+'%</span></div>'
        +'<div class="gline"><span style="width:'+pct.toFixed(1)+'%"></span></div>'
        +'<div class="gm"><span>'+euro0(bal)+'</span><span>objectif '+euro0(goal)+'</span></div></div>';
    });
    document.getElementById("goals").innerHTML=any?g:'<div class="empty">Ajoute un objectif à une enveloppe pour suivre ta progression.</div>';
    renderSavingsTrack();
    renderHistory();
    if(window.Bank)Bank.renderTx();
  }

  /* suivi de l'épargne : solde « déjà » de chaque enveloppe, mois par mois */
  function renderSavingsTrack(){
    var keys=Object.keys(state.months).sort();
    var cur=m().savings||[];
    var chartHost=document.getElementById("svchart"), listHost=document.getElementById("svlist");
    document.getElementById("svMeta").textContent=keys.length+" mois";
    if(!cur.length){ chartHost.innerHTML=""; listHost.innerHTML='<div class="empty">Aucune enveloppe d\'épargne pour l\'instant.</div>'; return; }
    var series=cur.map(function(l,i){
      var pts=keys.map(function(k){ var mo=state.months[k]; var f=(mo.savings||[]).filter(function(x){return x.label===l.label;})[0]; return f?num(f.balance):null; });
      return {label:l.label,color:COLORS[i%COLORS.length],pts:pts};
    });
    var idx=keys.indexOf(state.activeMonth), prevIdx=idx-1, hasPrev=prevIdx>=0;
    var list="", total=0, totalPrev=0;
    series.forEach(function(s){
      var now=s.pts[idx]||0, prev=hasPrev?s.pts[prevIdx]:null;
      total+=now; if(prev!=null)totalPrev+=prev;
      var d="", cls="";
      if(prev!=null){ var diff=now-prev; cls=diff>0?"up":(diff<0?"dn":""); d=(diff>0?"+":(diff<0?"–":"±"))+" "+euro0(Math.abs(diff)); }
      list+='<div class="svrow"><span class="sw" style="background:'+s.color+'"></span><span class="nm">'+esc(s.label)+'</span><span class="dl '+cls+'">'+d+'</span><span class="bal num">'+euro0(now)+'</span></div>';
    });
    var td=total-totalPrev, tdTxt=hasPrev?((td>=0?"+":"–")+" "+euro0(Math.abs(td))+" ce mois"):"";
    listHost.innerHTML='<div class="svlist">'+list+'</div>'
      +'<div class="svtot"><span>Total épargné</span><span><span class="dl '+(hasPrev?(td>0?"up":(td<0?"dn":"")):"")+'" style="margin-right:10px">'+tdTxt+'</span><b class="num">'+euro0(total)+'</b></span></div>';

    if(keys.length<2){ chartHost.innerHTML='<div class="empty">Mets à jour « déjà » chaque mois : la courbe de chaque enveloppe apparaît dès le deuxième mois.</div>'; return; }
    var W=680,H=200,pl=46,pr=14,ptp=14,pb=26,innerW=W-pl-pr,innerH=H-ptp-pb;
    var all=[0]; series.forEach(function(s){ s.pts.forEach(function(v){ if(v!=null)all.push(v); }); });
    var mx=Math.max.apply(null,all); if(mx<=0)mx=100; mx*=1.08;
    function X(i){ return pl+i/(keys.length-1)*innerW; }
    function Y(v){ return ptp+(mx-v)/mx*innerH; }
    var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Épargne mois par mois">';
    [mx,mx/2,0].forEach(function(v){ svg+='<line class="grid" x1="'+pl+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(pl-8)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+euro0(v)+'</text>'; });
    series.forEach(function(s){
      var d="",started=false;
      s.pts.forEach(function(v,i){ if(v==null){started=false;return;} d+=(started?" L":" M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); started=true; });
      svg+='<path class="line" style="stroke:'+s.color+'" d="'+d.trim()+'"/>';
      s.pts.forEach(function(v,i){ if(v==null)return; svg+='<circle class="pt" style="stroke:'+s.color+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===idx?4:2.6)+'"/>'; });
    });
    keys.forEach(function(k,i){ var last=i===keys.length-1; if(i%Math.ceil(keys.length/6||1)===0||last) svg+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+shortFor(k)+'</text>'; });
    svg+='</svg>'; chartHost.innerHTML=svg;
  }

  function renderHistory(){
    var keys=Object.keys(state.months).sort();
    var pts=keys.map(function(k){ return {k:k,v:marginOf(state.months[k])}; });
    document.getElementById("trMeta").textContent=keys.length+" mois";
    var host=document.getElementById("hist");
    if(pts.length<2){ host.innerHTML='<div class="empty">Un seul mois pour l\'instant. Les flèches ‹ › en haut créent les mois suivants — la courbe apparaît dès le deuxième.</div>'; return; }
    var W=680,H=200,pl=46,pr=14,ptp=14,pb=26,innerW=W-pl-pr,innerH=H-ptp-pb;
    var vals=pts.map(function(p){return p.v;}), mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
    if(mx===mn){mx+=50;mn-=50;} var pad=(mx-mn)*0.14; mx+=pad; mn-=pad;
    function X(i){ return pl+i/(pts.length-1)*innerW; }
    function Y(v){ return ptp+(mx-v)/(mx-mn)*innerH; }
    var d=""; pts.forEach(function(p,i){ d+=(i?" L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1); });
    var zeroY=(mn<0&&mx>0)?Y(0):null;
    var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Marge mois par mois">';
    [mx,(mx+mn)/2,mn].forEach(function(v){ svg+='<text x="'+(pl-8)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+euro0(v)+'</text>'; });
    if(zeroY!=null) svg+='<line class="zero" x1="'+pl+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+zeroY.toFixed(1)+'"/>';
    svg+='<path class="line" d="'+d+'"/>';
    pts.forEach(function(p,i){ var last=i===pts.length-1;
      svg+='<circle class="pt'+(last?' last':'')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?4:2.6)+'"/>';
      if(i%Math.ceil(pts.length/6||1)===0||last) svg+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+shortFor(p.k)+'</text>';
    });
    svg+='</svg>'; host.innerHTML=svg;
  }

  function renderHeader(){ document.getElementById("curMonth").textContent=labelFor(state.activeMonth);
    document.getElementById("setRed").value=fmtIn(state.settings.red); document.getElementById("setGreen").value=fmtIn(state.settings.green); }
  function renderAll(){ renderHeader(); renderLedger(); renderDerived(); }

  var L=document.getElementById("ledger");
  L.addEventListener("input",function(e){ var el=e.target,f=el.getAttribute("data-field"); if(!f)return;
    var row=el.closest("[data-id]"),cat=el.closest("[data-cat]"); if(!row||!cat)return;
    var item=m()[cat.getAttribute("data-cat")].filter(function(x){return x.id===row.getAttribute("data-id");})[0]; if(!item)return;
    if(f==="label")item.label=el.value;
    else if(f==="paid"){ item.paid=el.checked; if(!el.checked)delete item.paidTx; row.classList.toggle("paid",el.checked); }
    else item[f]=num(el.value);
    touched(); renderDerived(); });
  L.addEventListener("change",function(e){ var f=e.target.getAttribute("data-field"); if(f&&f!=="label"&&f!=="paid")e.target.value=fmtIn(num(e.target.value)); });
  L.addEventListener("click",function(e){ var act=e.target.getAttribute("data-act"); if(!act)return;
    var cat=e.target.closest("[data-cat]").getAttribute("data-cat");
    if(act==="add"){ m()[cat].push(line("Nouvelle ligne",0, cat==="savings"?{balance:0,goal:0}:null)); touched(); renderLedger(); renderDerived(); }
    else if(act==="del"){ var id=e.target.closest("[data-id]").getAttribute("data-id"); m()[cat]=m()[cat].filter(function(x){return x.id!==id;}); touched(); renderLedger(); renderDerived(); } });

  function bindSet(id,key){ var el=document.getElementById(id);
    el.addEventListener("input",function(){ state.settings[key]=num(el.value); touched(); renderDerived(); });
    el.addEventListener("change",function(){ el.value=fmtIn(num(el.value)); }); }
  bindSet("setRed","red"); bindSet("setGreen","green");

  function go(delta){ var t=shiftKey(state.activeMonth,delta);
    if(!state.months[t]){ var copy=JSON.parse(JSON.stringify(m())); (copy.fixed||[]).forEach(function(l){ l.paid=false; }); state.months[t]=copy; }
    state.activeMonth=t; touched(); renderAll(); if(window.Bank)Bank.reconcile(); }
  document.getElementById("prevM").addEventListener("click",function(){go(-1);});
  document.getElementById("nextM").addEventListener("click",function(){go(1);});

  state=loadLocal()||defaultState();
  if(!state.months||!state.months[state.activeMonth])state=defaultState();
  if(!state.settings)state.settings={red:0,green:100};
  renderAll();
  window.App={ state:function(){return state;}, month:m, touched:touched, renderLedger:renderLedger, renderDerived:renderDerived, esc:esc, euro:euro, euro0:euro0, num:num, MO3:MO3 };
})();
</script>
<script>
/* ---- Banque (Enable Banking via /api/bank/*) ---- */
(function(){
  "use strict";
  var LS_BANK="cowrie-bank", LS_KEY="cowrie-key", REFRESH_MS=6*3600*1000;
  var bank=load(), banks=null, busy=false, msg="";
  function load(){ try{ var r=localStorage.getItem(LS_BANK); return r?JSON.parse(r):null; }catch(e){ return null; } }
  function save(){ try{ if(bank)localStorage.setItem(LS_BANK,JSON.stringify(bank)); else localStorage.removeItem(LS_BANK); }catch(e){} }
  function key(){ try{ return localStorage.getItem(LS_KEY)||""; }catch(e){ return ""; } }
  function setKey(k){ try{ if(k)localStorage.setItem(LS_KEY,k); else localStorage.removeItem(LS_KEY); }catch(e){} }
  function $(id){ return document.getElementById(id); }
  var esc=App.esc, euro=App.euro, num=App.num;

  function api(method,path,body){
    return fetch(path,{method:method,headers:{"Content-Type":"application/json","x-app-key":key()},body:body?JSON.stringify(body):undefined})
      .then(function(r){ return r.text().then(function(t){ var d={}; try{ d=t?JSON.parse(t):{}; }catch(e){ d={error:t}; }
        if(r.status===401){ setKey(""); throw new Error("Mot de passe incorrect"); }
        if(!r.ok) throw new Error(d.error||("Erreur "+r.status)); return d; }); });
  }

  /* --- normalisation / rapprochement --- */
  var STOP={"les":1,"des":1,"une":1,"pour":1,"avec":1,"remb":1,"forfait":1,"forfaits":1,"abonnement":1,"mensuel":1,"nouvelle":1,"ligne":1,"prlv":1,"sepa":1,"carte":1,"paiement":1,"cb":1};
  function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
  function words(s){ return norm(s).split(" ").filter(function(w){ return w.length>=3&&!STOP[w]; }); }
  function monthOf(d){ return d?d.slice(0,7):""; }
  function txsOf(monthKey){
    if(!bank||!bank.data)return [];
    var all=[]; (bank.data.accounts||[]).forEach(function(a){ (a.transactions||[]).forEach(function(t){ if(monthOf(t.date)===monthKey)all.push(t); }); });
    all.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); }); return all;
  }
  function matchLine(line,txs){
    var ws=line.match?words(line.match):words(line.label); if(!ws.length)return null;
    var cands=txs.filter(function(t){ if(t.amount>=0||t.pending)return false; var n=norm(t.text); return ws.some(function(w){ return n.indexOf(w)>=0; }); });
    if(!cands.length)return null;
    var target=num(line.amount);
    cands.sort(function(a,b){ return Math.abs(Math.abs(a.amount)-target)-Math.abs(Math.abs(b.amount)-target); });
    return cands[0];
  }
  // Coche automatiquement les dépenses fixes retrouvées dans les transactions du mois actif (ne décoche jamais).
  function reconcile(){
    var st=App.state(), mo=App.month(), txs=txsOf(st.activeMonth); if(!txs.length)return false;
    var used={}, changed=false;
    (mo.fixed||[]).forEach(function(l){ if(l.paidTx)used[l.paidTx]=1; });
    (mo.fixed||[]).forEach(function(l){ if(l.paid)return; var t=matchLine(l,txs.filter(function(x){ return !used[x.id]; })); if(t){ l.paid=true; l.paidTx=t.id; used[t.id]=1; changed=true; } });
    if(changed)App.touched(); return changed;
  }

  /* --- rendu --- */
  function status(txt,cls){ var el=$("bkSt"); el.textContent=txt||""; el.className="bk-st"+(cls?" "+cls:""); }
  function ago(iso){ var m=Math.round((Date.now()-new Date(iso).getTime())/60000); if(m<2)return "à l'instant"; if(m<60)return "il y a "+m+" min"; var h=Math.round(m/60); if(h<48)return "il y a "+h+" h"; return "il y a "+Math.round(h/24)+" j"; }
  function render(){
    var b=$("bkBody"), h="";
    if(!key()){
      h='<div class="note">Entre le mot de passe de l\'app pour activer la connexion bancaire.</div>'
        +'<form class="pw" id="pwForm"><input type="password" id="pwIn" placeholder="Mot de passe" autocomplete="current-password"><button class="btn pri" type="submit">OK</button></form>';
      status("");
    } else if(!bank){
      h='<div class="note">Relie ton compte bancaire : tes dépenses fixes seront cochées automatiquement et tu verras tes transactions du mois. Accès en lecture seule, valable 90 jours.</div>';
      if(!banks) h+='<div class="bk-acts"><button class="btn pri" id="bkPick">Connecter ma banque</button></div>';
      else h+='<input class="bk-search" id="bkQ" placeholder="Rechercher ta banque…" autocomplete="off"><div class="bk-list" id="bkList"></div>';
      status(msg, msg?"err":"");
    } else {
      var d=bank.data;
      (bank.accounts||[]).forEach(function(a){
        var acc=d&&(d.accounts||[]).filter(function(x){return x.uid===a.uid;})[0];
        h+='<div class="bk-acc"><div><div class="nm">'+esc(a.name)+'</div>'+(a.iban?'<div class="ib">'+esc(a.iban.replace(/(.{4})/g,"$1 ").trim())+'</div>':'')+'</div>'
          +'<div class="bal num">'+(acc&&acc.balance?euro(acc.balance.amount):"—")+'</div></div>';
      });
      var exp=bank.valid_until?new Date(bank.valid_until):null, daysLeft=exp?Math.round((exp-Date.now())/86400000):null;
      h+='<div class="bk-acts"><button class="btn" id="bkRefresh"'+(busy?' disabled':'')+'>'+(busy?"Actualisation…":"Actualiser")+'</button><button class="btn" id="bkOut">Déconnecter</button></div>';
      h+='<div class="note">'+(d?"Actualisé "+ago(d.fetched_at)+". ":"")+(daysLeft!=null?"Consentement valable encore "+daysLeft+" j. ":"")+"Les banques limitent à quelques actualisations par jour.</div>";
      status(msg||(d?"Connectée":""), msg?"err":"ok");
    }
    b.innerHTML=h;
    if($("pwForm"))$("pwForm").addEventListener("submit",function(e){ e.preventDefault(); setKey($("pwIn").value.trim()); msg=""; render(); });
    if($("bkPick"))$("bkPick").addEventListener("click",loadBanks);
    if($("bkQ")){ $("bkQ").addEventListener("input",renderBankList); renderBankList(); $("bkQ").focus(); }
    if($("bkRefresh"))$("bkRefresh").addEventListener("click",function(){ refresh(true); });
    if($("bkOut"))$("bkOut").addEventListener("click",disconnect);
    renderTx();
  }
  function renderBankList(){
    var q=norm($("bkQ").value), list=banks.filter(function(b){ return !q||norm(b.name).indexOf(q)>=0; }).slice(0,60), h="";
    list.forEach(function(b,i){ h+='<button data-i="'+banks.indexOf(b)+'">'+(b.logo?'<img src="'+esc(b.logo)+'" alt="">':'')+'<span>'+esc(b.name)+'</span></button>'; });
    $("bkList").innerHTML=h||'<div class="empty" style="padding:10px 12px">Aucune banque trouvée.</div>';
    $("bkList").querySelectorAll("button").forEach(function(btn){ btn.addEventListener("click",function(){ connect(banks[+btn.getAttribute("data-i")]); }); });
  }
  function renderTx(){
    var card=$("txCard"); if(!bank||!bank.data){ card.hidden=true; return; }
    var st=App.state(), mo=App.month(), k=st.activeMonth, txs=txsOf(k);
    card.hidden=false;
    $("txTitle").textContent="Transactions de "+App.MO3[(+k.split("-")[1])-1]+" "+k.split("-")[0];
    $("txMeta").textContent=txs.length+" opération"+(txs.length>1?"s":"");
    var out=0, inn=0; txs.forEach(function(t){ if(t.pending)return; if(t.amount<0)out+=-t.amount; else inn+=t.amount; });
    $("txSum").innerHTML='<span>Sorties <b class="num">'+euro(out)+'</b></span><span>Entrées <b class="num">'+euro(inn)+'</b></span>';
    if(!txs.length){ $("txList").innerHTML='<div class="empty">Aucune transaction pour ce mois dans la période récupérée ('+(bank.data.from||"")+' → '+(bank.data.to||"")+').</div>'; return; }
    var byTx={}; (mo.fixed||[]).forEach(function(l){ if(l.paidTx)byTx[l.paidTx]=l; });
    var opts='<option value="">→</option>'; (mo.fixed||[]).forEach(function(l){ opts+='<option value="'+l.id+'">'+esc(l.label)+'</option>'; });
    var h="";
    txs.forEach(function(t){
      var l=byTx[t.id], d=t.date?t.date.slice(8,10)+"/"+t.date.slice(5,7):"";
      h+='<div class="tx'+(t.pending?" pend":"")+'" data-tx="'+esc(t.id)+'"><span class="dt">'+d+'</span>'
        +'<span class="tt" title="'+esc(t.text)+'">'+esc(t.text||"—")+(l?'<span class="lk">✓ '+esc(l.label)+'</span>':'')+'</span>'
        +(t.amount<0?'<select class="'+(l?"set":"")+'" aria-label="Associer à une dépense fixe">'+opts.replace('value="'+(l?l.id:"__")+'"','value="'+(l?l.id:"__")+'" selected')+'</select>':'')
        +'<span class="am num'+(t.amount>=0?" in":"")+'">'+(t.amount>=0?"+":"–")+"\u202F"+euro(Math.abs(t.amount))+'</span></div>';
    });
    $("txList").innerHTML=h;
    $("txList").querySelectorAll("select").forEach(function(sel){ sel.addEventListener("change",function(){ link(sel.closest("[data-tx]").getAttribute("data-tx"),sel.value); }); });
  }
  // Association manuelle : la ligne retient un mot-clé issu de la transaction pour les mois suivants.
  function link(txId,lineId){
    var mo=App.month(), txs=txsOf(App.state().activeMonth), t=txs.filter(function(x){return x.id===txId;})[0];
    (mo.fixed||[]).forEach(function(l){ if(l.paidTx===txId){ l.paid=false; delete l.paidTx; } });
    if(lineId&&t){ var l=(mo.fixed||[]).filter(function(x){return x.id===lineId;})[0]; if(l){ l.paid=true; l.paidTx=txId; var ws=words(t.text); if(ws.length)l.match=ws.slice(0,2).join(" "); } }
    App.touched(); App.renderLedger(); App.renderDerived();
  }

  /* --- actions --- */
  function loadBanks(){ msg=""; status("Chargement…"); api("GET","/api/bank/banks?country=FR").then(function(list){ banks=list; render(); }).catch(function(e){ msg=e.message; render(); }); }
  function connect(b){
    status("Redirection vers "+b.name+"…");
    var redirect=location.origin+"/";
    api("POST","/api/bank/auth",{bank:b.name,country:b.country,redirect_url:redirect}).then(function(r){
      try{ sessionStorage.setItem("cowrie-bank-state",r.state); }catch(e){}
      location.href=r.url;
    }).catch(function(e){ msg=e.message; render(); });
  }
  function finishAuth(code){
    status("Connexion…");
    history.replaceState(null,"",location.pathname);
    api("POST","/api/bank/session",{code:code}).then(function(r){
      bank={session_id:r.session_id,accounts:r.accounts,valid_until:r.valid_until,data:null}; save(); render(); refresh(true);
    }).catch(function(e){ msg="Connexion échouée : "+e.message; render(); });
  }
  function refresh(force){
    if(!bank||busy)return;
    if(!force&&bank.data&&Date.now()-new Date(bank.data.fetched_at).getTime()<REFRESH_MS)return;
    busy=true; msg=""; render();
    var from=new Date(); from.setMonth(from.getMonth()-2); from.setDate(1);
    var q="?session_id="+encodeURIComponent(bank.session_id)+"&accounts="+encodeURIComponent(bank.accounts.map(function(a){return a.uid;}).join(","))+"&from="+from.toISOString().slice(0,10);
    api("GET","/api/bank/data"+q).then(function(d){
      bank.data=d; save(); busy=false;
      var errs=[]; d.accounts.forEach(function(a){ errs=errs.concat(a.errors||[]); }); if(errs.length)msg=errs[0];
      var changed=reconcile(); render(); if(changed){ App.renderLedger(); App.renderDerived(); }
    }).catch(function(e){ busy=false; msg=e.message; if(/session|expir|401|403/i.test(e.message)&&!bank.data){ bank=null; save(); } render(); });
  }
  function disconnect(){
    if(!confirm("Déconnecter la banque ? Les cases déjà cochées restent."))return;
    var id=bank.session_id; bank=null; save(); render();
    api("DELETE","/api/bank/session?id="+encodeURIComponent(id)).catch(function(){});
  }

  window.Bank={ renderTx:renderTx, reconcile:function(){ if(reconcile()){ App.renderLedger(); App.renderDerived(); } } };
  var params=new URLSearchParams(location.search);
  if(params.get("code")){ render(); finishAuth(params.get("code")); }
  else{ render(); if(bank){ if(reconcile()){ App.renderLedger(); App.renderDerived(); } refresh(false); } }
})();
</script>
</body>
</html>
